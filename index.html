<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CN-US Hoops Tracker | 纯净数据库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #111827;
        }

        .table-row-hover:hover {
            background-color: #f9fafb;
        }
        
        .star-color { color: #fbbf24; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 导航栏 -->
    <nav class="bg-gray-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 font-black text-2xl tracking-tighter text-red-500">
                        CN-US HOOPS
                    </div>
                    <div class="hidden md:block">
                        <div class="ml-10 flex items-baseline space-x-4">
                            <a href="index.html" class="bg-gray-800 text-white px-3 py-2 rounded-md text-sm font-bold border-b-2 border-red-500">主页 / 数据库</a>
                            <a href="college.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-semibold transition">大学 (NCAA/NJCAA)</a>
                            <a href="highschool.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-semibold transition">高中 (HS/Prep)</a>
                            <a href="rankings.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-semibold transition">历届排名</a>
                        </div>
                    </div>
                </div>
                <!-- 搜索框 -->
                <div class="hidden md:block">
                    <div class="relative">
                        <input type="text" class="bg-gray-800 text-sm rounded-md pl-10 pr-4 py-1.5 focus:outline-none focus:ring-1 focus:ring-red-500 text-white placeholder-gray-400 border border-gray-700" placeholder="搜索球员或学校...">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 纯数据主页布局 -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col md:flex-row gap-8">
        
        <!-- 左侧：数据库筛选器 -->
        <aside class="w-full md:w-64 flex-shrink-0">
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden sticky top-6">
                <div class="px-4 py-3 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                    <h2 class="text-sm font-bold text-gray-800 uppercase tracking-wider">数据库筛选</h2>
                    <button class="text-xs text-red-600 hover:text-red-800 font-semibold">重置</button>
                </div>
                
                <div class="p-4 space-y-6">
                    <!-- 联盟筛选 -->
                    <div>
                        <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">所属级别 (Level)</h3>
                        <div class="space-y-2">
                            <label class="flex items-center text-sm font-medium text-gray-700 cursor-pointer">
                                <input type="checkbox" class="rounded text-red-600 focus:ring-red-500 h-4 w-4 mr-2" checked> NCAA D1
                            </label>
                            <label class="flex items-center text-sm font-medium text-gray-700 cursor-pointer">
                                <input type="checkbox" class="rounded text-red-600 focus:ring-red-500 h-4 w-4 mr-2"> NCAA D2/D3
                            </label>
                            <label class="flex items-center text-sm font-medium text-gray-700 cursor-pointer">
                                <input type="checkbox" class="rounded text-red-600 focus:ring-red-500 h-4 w-4 mr-2" checked> High School
                            </label>
                        </div>
                    </div>

                    <!-- 届份筛选 -->
                    <div>
                        <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">毕业届份 (Class)</h3>
                        <select class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm rounded-md border">
                            <option>所有届份</option>
                            <option>2024</option>
                            <option selected>2025</option>
                            <option>2026</option>
                            <option>2027+</option>
                        </select>
                    </div>

                    <button class="w-full bg-gray-900 text-white font-bold py-2 px-4 rounded hover:bg-gray-800 transition">
                        应用筛选
                    </button>
                </div>
            </div>
        </aside>

        <!-- 右侧：数据列表 -->
        <section class="flex-grow">
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-white">
                    <h1 class="text-xl font-black text-gray-900 tracking-tight">球员数据库</h1>
                </div>

                <!-- 动态数据列表容器 -->
                <div id="player-list" class="divide-y divide-gray-200">
                    <div class="p-8 text-center text-gray-500 font-bold animate-pulse">
                        正在从 Supabase 数据库加载球员...
                    </div>
                </div>

                <!-- 分页 -->
                <div class="px-6 py-4 border-t border-gray-200 bg-gray-50 flex items-center justify-between">
                    <span class="text-sm text-gray-700">
                        当前仅展示数据库测试数据
                    </span>
                    <div class="flex space-x-1">
                        <button class="px-3 py-1 border border-gray-300 rounded bg-white text-sm font-medium text-gray-500 hover:bg-gray-50" disabled>上一页</button>
                        <button class="px-3 py-1 border border-red-500 rounded bg-red-50 text-sm font-medium text-red-600">1</button>
                        <button class="px-3 py-1 border border-gray-300 rounded bg-white text-sm font-medium text-gray-700 hover:bg-gray-50">下一页</button>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- 与 Supabase 交互的魔法代码 -->
    <script>
        // 你的 Supabase 专属信息
        const SUPABASE_URL = 'https://wdxpqdnyeovbeypmvgqz.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkeHBxZG55ZW92YmV5cG12Z3F6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTk5OTAsImV4cCI6MjEwMzU5NTk5MH0.abtASfU9S0eh4iJTUCLRmxPteLakAc-AgSA2qmotD3U';

        async function fetchPlayers() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/players?select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const players = await response.json(); 
                
                const listContainer = document.getElementById('player-list');
                listContainer.innerHTML = ''; 

                if(players.length === 0) {
                    listContainer.innerHTML = '<div class="p-8 text-center text-gray-500">你的数据库里目前还没有球员数据，去 Supabase 添加一条吧！</div>';
                    return;
                }

                players.forEach((player, index) => {
                    const cardHTML = `
                    <a href="player.html" class="block bg-white hover:bg-gray-50 transition p-4">
                        <div class="flex items-center">
                            <div class="w-12 text-center text-gray-400 font-black text-xl italic border-r border-gray-200 mr-4">${index + 1}</div>
                            
                            <div class="relative w-16 h-16 flex-shrink-0 bg-gray-200 rounded overflow-hidden mr-4 border border-gray-300">
                                <img src="https://placehold.co/100x100/eeeeee/999999?text=PIC" class="w-full h-full object-cover">
                            </div>

                            <div class="flex-grow min-w-0">
                                <div class="flex items-baseline">
                                    <h2 class="text-lg font-black text-gray-900 truncate">${player.name || '未知球员'}</h2>
                                    <span class="ml-2 px-1.5 py-0.5 rounded text-[10px] font-bold bg-gray-800 text-white tracking-wide">${player.level || '-'}</span>
                                </div>
                                <div class="text-sm text-gray-600 font-medium mt-0.5">
                                    ${player.position || '-'} | ${player.height || '-'} | ${player.weight || '-'} lbs
                                </div>
                                <div class="text-xs text-gray-500 mt-1 flex items-center">
                                    <span class="font-bold text-gray-700">${player.school || '-'}</span>
                                    <span class="mx-2 text-gray-300">|</span>
                                    ${player.class_year || '-'}
                                </div>
                            </div>

                            <div class="flex flex-col items-end text-right ml-4">
                                <div class="flex items-center text-yellow-400 text-lg mb-1" title="综合星级">
                                    ${player.stars || 'NR'} ★
                                </div>
                                <div class="flex gap-4 text-center mt-1">
                                    <div>
                                        <div class="text-[10px] text-gray-500 font-bold uppercase">PTS</div>
                                        <div class="text-sm font-black text-gray-900">${player.points || '-'}</div>
                                    </div>
                                    <div>
                                        <div class="text-[10px] text-gray-500 font-bold uppercase">REB</div>
                                        <div class="text-sm font-black text-gray-900">${player.rebounds || '-'}</div>
                                    </div>
                                    <div>
                                        <div class="text-[10px] text-gray-500 font-bold uppercase">AST</div>
                                        <div class="text-sm font-black text-gray-900">${player.assists || '-'}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </a>
                    `;
                    listContainer.innerHTML += cardHTML;
                });

            } catch (error) {
                console.error("数据请求失败：", error);
                document.getElementById('player-list').innerHTML = `
                    <div class="p-8 text-center">
                        <p class="text-red-500 font-bold mb-2">无法连接到数据库</p>
                        <p class="text-xs text-gray-400">错误信息: ${error.message} <br>请确认 Supabase 设置中已关闭 RLS，并检查密钥是否正确。</p>
                    </div>`;
            }
        }

        fetchPlayers();
    </script>
</body>
</html>
